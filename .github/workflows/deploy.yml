# İş akışının adı
name: Lint, Secure and Deploy

# Tetikleyiciler
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# İşler
jobs:
  # --- İŞ 1: Kod Kalitesini ve Güvenliği Kontrol Et ---
  # --- İŞ 1: Kod Kalitesini ve Güvenliği Kontrol Et ---
  lint:
    name: Run Linter and Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        working-directory: ./site  # Sadece bu satır yeterli

      - name: Run ESLint
        run: npx eslint . --ext .js
        working-directory: ./site  # Sadece bu satır yeterli

      - name: Run Stylelint
        run: npx stylelint "**/*.css"
        working-directory: ./site  # Sadece bu satır yeterli

      # CodeQL adımlarını geçici olarak devre dışı bırakıyoruz.
      # Bunları daha sonra doğru şekilde tekrar ekleyeceğiz.
      # - name: Perform CodeQL Analysis
      #   uses: github/codeql-action/analyze@v3