# İş akışının adı
name: Lint, Security and Deploy

# Tetikleyiciler
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# İşler
jobs:
  # --- İŞ 1: Kod Kalitesini ve Güvenliği Kontrol Et ---
  lint-and-security:
    name: Code Quality and Security Checks
    runs-on: ubuntu-latest
    
    steps:
      # Kodu çek
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Node.js kur
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      # package.json yoksa oluştur ve gerekli paketleri yükle
      - name: Initialize npm and install linting tools
        run: |
          # package.json yoksa oluştur
          if [ ! -f package.json ]; then
            echo "Creating package.json..."
            npm init -y
            
            # Proje bilgilerini güncelle
            npm pkg set name="fokus-web-app"
            npm pkg set version="1.0.0"
            npm pkg set description="Fokus Web Application"
            npm pkg set scripts.lint:js="eslint . --ext .js,.html --ignore-path .gitignore"
            npm pkg set scripts.lint:css="stylelint '**/*.css' --ignore-path .gitignore"
            npm pkg set scripts.lint="npm run lint:js && npm run lint:css"
          fi
          
          # Development dependencies olarak linting araçlarını yükle
          echo "Installing linting tools..."
          npm install --save-dev \
            eslint@latest \
            stylelint@latest \
            stylelint-config-standard@latest \
            eslint-plugin-html@latest
          
          # .gitignore'a node_modules ekle (eğer yoksa)
          if ! grep -q "node_modules" .gitignore 2>/dev/null; then
            echo "node_modules/" >> .gitignore
          fi
      
      # ESLint yapılandırmasını kontrol et ve gerekirse oluştur
      - name: Ensure ESLint configuration
        run: |
          if [ ! -f .eslintrc.json ]; then
            echo "Creating .eslintrc.json..."
            cat > .eslintrc.json << 'EOF'
          {
            "env": {
              "browser": true,
              "es2021": true
            },
            "extends": "eslint:recommended",
            "parserOptions": {
              "ecmaVersion": "latest",
              "sourceType": "module"
            },
            "plugins": ["html"],
            "rules": {
              "indent": ["error", 2],
              "linebreak-style": ["error", "unix"],
              "quotes": ["error", "single"],
              "semi": ["error", "always"]
            }
          }
          EOF
          fi
      
      # Stylelint yapılandırmasını kontrol et ve gerekirse oluştur
      - name: Ensure Stylelint configuration
        run: |
          if [ ! -f .stylelintrc.json ]; then
            echo "Creating .stylelintrc.json..."
            cat > .stylelintrc.json << 'EOF'
          {
            "extends": "stylelint-config-standard",
            "rules": {
              "indentation": 2,
              "string-quotes": "single"
            }
          }
          EOF
          fi
      
      # JavaScript dosyalarını kontrol et
      - name: Run ESLint
        run: |
          # JavaScript dosyası var mı kontrol et
          if find . -name "*.js" -o -name "*.html" | grep -q .; then
            echo "Running ESLint..."
            npx eslint . --ext .js,.html --ignore-path .gitignore || true
          else
            echo "No JavaScript files found to lint"
          fi
        continue-on-error: true
      
      # CSS dosyalarını kontrol et
      - name: Run Stylelint
        run: |
          # CSS dosyası var mı kontrol et
          if find . -name "*.css" | grep -q .; then
            echo "Running Stylelint..."
            npx stylelint "**/*.css" --ignore-path .gitignore || true
          else
            echo "No CSS files found to lint"
          fi
        continue-on-error: true
      
      # CodeQL güvenlik analizi başlat
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
        continue-on-error: true
      
      # CodeQL analizini gerçekleştir
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
      
      # Oluşturulan dosyaları commit et (sadece main branch'te ve push event'inde)
      - name: Commit generated files if needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Değişiklik var mı kontrol et
          if [ -n "$(git status --porcelain)" ]; then
            git add package.json package-lock.json .eslintrc.json .stylelintrc.json .gitignore 2>/dev/null || true
            git diff --staged --quiet || git commit -m "Auto-generate npm configuration and linting files [skip ci]"
            git push origin main || echo "No push needed or push failed"
          else
            echo "No changes to commit"
          fi
        continue-on-error: true

  # --- İŞ 2: Sunucuya Dağıt ---
  deploy:
    name: Deploy to Production VPS
    # Bu iş, sadece 'lint-and-security' işi başarıyla biterse çalışır
    needs: lint-and-security
    # Bu iş, sadece 'main' dalına bir push olduğunda çalışır, PR'larda değil
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    
    steps:
      # En son kodu çek
      - name: Pull latest source code
        run: |
          cd /home/ibra/projects/fokus-web-app
          git pull origin main
      
      # Docker container'ları yeniden başlat
      - name: Rebuild and Deploy Docker Container
        run: |
          cd /home/ibra/projects/fokus-web-app
          docker compose down
          docker compose up -d --build
      
      # Deployment durumunu kontrol et
      - name: Verify deployment
        run: |
          cd /home/ibra/projects/fokus-web-app
          echo "Checking container status..."
          docker compose ps
          echo "Deployment completed successfully!"