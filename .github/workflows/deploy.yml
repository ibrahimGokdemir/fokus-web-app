name: Lint and Deploy to VPS
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  # --- İŞ 1: Kod Kalitesini Kontrol Et ---
  lint:
    name: Run Linter Checks
    runs-on: ubuntu-latest
   
    steps:
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: List files (debug için)
      run: |
        ls -la
        find . -name "package.json" -type f
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      working-directory: ./  # package.json'ın bulunduğu dizin
          
    - name: Run ESLint
      run: npx eslint . --ext .js
          
    - name: Run Stylelint
      run: npx stylelint "**/*.css"
        
  # --- İŞ 2: Sunucuya Dağıt ---
  deploy:
    name: Deploy to VPS
    needs: lint
    runs-on: self-hosted
    steps:
      - name: Pull latest source code
        run: git pull origin main
        working-directory: /home/ibra/projects/fokus-web-app
        
      - name: Rebuild and Deploy Docker Container
        run: |
          docker compose down
          docker compose up -d
        working-directory: /home/ibra/projects/fokus-web-app