# İş akışının yeni, basit adı
name: CI Checks

# Sadece main'e açılan Pull Request'lerde tetiklenecek
on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Verify Setup Complete
        run: echo "Temel kurulum başarıyla tamamlandı!"
        
      # --- YENİ ADIM ---
      - name: Install dependencies
        run: npm install
        working-directory: ./site