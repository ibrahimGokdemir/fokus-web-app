# İş akışının yeni, basit adı
name: CI Checks

# Sadece main'e açılan Pull Request'lerde tetiklenecek
on:
  pull_request:
    branches:
      - main

jobs:
  # Tek bir işimiz var
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      # Adım 1: Kodu indir
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Adım 2: Node.js ortamını kur
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # Adım 3: Kurulumu doğrula (Yeşil tik görmek için)
      - name: Verify Setup Complete
        run: echo "Temel kurulum başarıyla tamamlandı!"