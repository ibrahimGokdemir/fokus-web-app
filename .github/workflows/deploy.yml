name: Lint and Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # --- JOB 1: Check Code Quality ---
  lint:
    name: Run Linter Checks
    runs-on: ubuntu-latest

    # --- FINAL FIX: We set the default working directory
    # to that stubborn subfolder.
    defaults:
      run:
        working-directory: ./fokus-web-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint . --ext .js

      - name: Run Stylelint
        run: npx stylelint "**/*.css"

  # --- JOB 2: Deploy to Server ---
  deploy:
    name: Deploy to VPS
    needs: lint
    runs-on: self-hosted

    steps:
      - name: Pull latest source code
        run: git pull origin main
        # --- THE FINAL FIX MADE WITH YOUR DISCOVERY ---
        working-directory: /home/ibra/projects/fokus-web-app

      - name: Rebuild and Deploy Docker Container
        run: |
          docker compose down
          docker compose up -d
        # --- THE FINAL FIX MADE WITH YOUR DISCOVERY ---
        working-directory: /home/ibra/projects/fokus-web-app