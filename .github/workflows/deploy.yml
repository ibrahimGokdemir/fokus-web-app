# İş akışının yeni, basit adı
name: CI Checks

# Sadece main'e açılan Pull Request'lerde tetiklenecek
on:
  pull_request:
    branches:
      - main

jobs:
  # Tek bir işimiz var
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      # Adım 1: Kodu indir
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Adım 2: Node.js ortamını kur
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        working-directory: ./site
        
      # --- YENİ ADIMLAR -----
      - name: Run ESLint
        run: npm run lint
        working-directory: ./site

      - name: Run Stylelint
        run: npm run stylelint
        working-directory: ./site