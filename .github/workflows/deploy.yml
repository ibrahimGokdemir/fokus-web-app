name: Lint and Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # --- İŞ 1: Kod Kalitesini Kontrol Et ---
  lint:
    name: Run Linter Checks
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Bu komut, kodu ${{ github.workspace }}/fokus-web-app/ altına indirir.
        # Bu yüzden sonraki adımlarda bu alt klasöre gitmemiz gerekiyor.
        with:
          path: 'fokus-web-app'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- NİHAİ DÜZELTME: Her komuta, çalışacağı adresi tek tek ve açıkça söylüyoruz ---
      - name: Install dependencies
        run: npm install
        working-directory: ./fokus-web-app

      - name: Run ESLint
        run: npx eslint . --ext .js
        working-directory: ./fokus-web-app

      - name: Run Stylelint
        run: npx stylelint "**/*.css"
        working-directory: ./fokus-web-app

  # --- İŞ 2: Sunucuya Dağıt ---
  deploy:
    name: Deploy to VPS
    needs: lint 
    runs-on: self-hosted

    steps:
      - name: Pull latest source code
        run: git pull origin main
        working-directory: /home/ibra/projects/fokus-web-app

      - name: Rebuild and Deploy Docker Container
        run: |
          docker compose down
          docker compose up -d
        working-directory: /home/ibra/projects/fokus-web-app