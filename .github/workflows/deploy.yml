name: Lint and Deploy to VPS
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  # --- İŞ 1: Kod Kalitesini Kontrol Et ---
 # --- İŞ 1: Kod Kalitesini ve Güvenliği Kontrol Et ---
lint:
  name: Run Linter and Security Checks
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # YENİ ADIM 1: CodeQL Motorunu Başlat
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript # Tarayacağımız dil

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run ESLint
      run: npx eslint . --ext .js

    - name: Run Stylelint
      run: npx stylelint "**/*.css"

    # YENİ ADIM 2: CodeQL Analizini Gerçekleştir
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
        
  # --- İŞ 2: Sunucuya Dağıt ---
  deploy:
    name: Deploy to VPS
    needs: lint
    runs-on: self-hosted
    steps:
      - name: Pull latest source code
        run: git pull origin main
        working-directory: /home/ibra/projects/fokus-web-app
        
      - name: Rebuild and Deploy Docker Container
        run: |
          docker compose down
          docker compose up -d
        working-directory: /home/ibra/projects/fokus-web-app